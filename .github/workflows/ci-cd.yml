name: CI/CD - Binelek Data Services

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Configure NuGet
      run: |
        dotnet nuget remove source github || true
        dotnet nuget add source https://nuget.pkg.github.com/k5tuck/index.json --name github --username k5tuck --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

    - name: Restore dependencies
      run: dotnet restore Binelek.Data.sln

    - name: Build binah-pipeline
      run: dotnet build services/binah-pipeline/Binah.Pipeline.csproj --no-restore --configuration Release

    - name: Build binah-context
      run: dotnet build services/binah-context/Binah.Context.csproj --no-restore --configuration Release

    - name: Run binah-context tests
      run: dotnet test services/binah-context/Tests/Binah.Context.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies for binah-search
      run: |
        cd services/binah-search
        pip install -r requirements.txt

    - name: Lint binah-search (Python)
      run: |
        cd services/binah-search
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Build Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ binah-pipeline: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ binah-context: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ binah-search: Python service validated" >> $GITHUB_STEP_SUMMARY
  
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy security scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
